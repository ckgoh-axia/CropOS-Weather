[tool.poetry]
name = "cropos"
version = "0.1.0"
description = "Hyper-local precipitation forecast for Thai smallholder farms"
authors = ["CropOS Team"]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.2.0"
torch-geometric = "^2.5.0"
openmeteo-requests = "^1.2.0"
requests-cache = "^1.2.0"
retry-requests = "^2.0.0"
gpm-api = "^0.6.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
xarray = "^2024.2.0"
scikit-learn = "^1.4.0"
mlflow = "^2.11.0"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pydantic = "^2.6.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
dvc = "^3.49.0"
huggingface-hub = "^0.21.0"
pyyaml = "^6.0.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
ruff = "^0.3.0"
bandit = "^1.7.0"
pre-commit = "^3.6.0"
respx = "^0.20.0"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
