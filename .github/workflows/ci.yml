name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            mlflow \
            openmeteo-requests requests-cache retry-requests \
            pandas numpy xarray scikit-learn \
            fastapi uvicorn pydantic httpx \
            python-dotenv "huggingface-hub>=0.21" pyarrow pyyaml tqdm \
            ruff bandit pytest pytest-asyncio pytest-cov respx

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Security scan with bandit
        run: bandit -r src/ -ll -q

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ tests/validation/ -v \
            --cov=src --cov-report=term-missing --cov-fail-under=68

      - name: Run integration tests
        run: pytest tests/integration/ -v

      - name: Check for secrets in diff
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
