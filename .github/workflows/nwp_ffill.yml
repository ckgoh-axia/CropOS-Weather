name: NWP Forward-fill (fix hourly null gaps)

on:
  workflow_dispatch:

jobs:
  nwp-ffill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install \
            pandas numpy pyarrow pyyaml \
            huggingface-hub
      - name: Forward-fill NWP nulls and push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/augment_data.py --nwp-ffill
