thailand:
  lat_min: 5.5
  lat_max: 20.5
  lon_min: 97.5
  lon_max: 105.7

metar_stations:
  - VTUU  # Ubon Ratchathani
  - VTUD  # Udon Thani
  - VTUK  # Khon Kaen
  - VTUB  # Buriram
  - VTUN  # Nakhon Ratchasima
  - VTUL  # Loei
  - VTCC  # Chiang Mai
  - VTCP  # Phitsanulok
  - VTCN  # Nan
  - VTBS  # Suvarnabhumi
  - VTBD  # Don Mueang
  - VTBP  # Prachin Buri
  - VTSS  # Hat Yai
  - VTSP  # Phuket
  - VTSH  # Surat Thani
  - VTSG  # Krabi

era5_variables:
  # Surface — ground truth reanalysis (do NOT change while ERA5 cron is running;
  # extended variables will be added in a separate era5_extended download pass)
  - temperature_2m
  - dewpoint_2m
  - relativehumidity_2m
  - precipitation
  - windspeed_10m
  - winddirection_10m
  - surface_pressure

# GFS variables fetched from Open-Meteo historical-forecast API.
# These are the PRIMARY model input features for the GFS-correction architecture.
# Naming matches Open-Meteo's GFS seamless model exactly — do not rename without
# testing against the API, as mismatches cause silent 0-row returns.
nwp_variables:
  # Surface — identical naming to ERA5 for clean train/serve feature parity
  - temperature_2m
  - dewpoint_2m
  - relativehumidity_2m
  - precipitation
  - windspeed_10m
  - winddirection_10m
  - surface_pressure
  # Convective instability — primary drivers of tropical rainfall
  # CAPE is the single most important variable missing from the original set
  - cape
  - lifted_index
  # NOTE: precipitable_water rejected by gfs_seamless historical-forecast-api —
  # omitted until correct variable name is confirmed for this endpoint.
  # Cloud layer structure — total cover doesn't distinguish anvil from BL cloud
  # Low = boundary layer cloud, Mid = congestus/altostratus, High = cirrus/anvil
  - cloudcover_low
  - cloudcover_mid
  - cloudcover_high
  # Diurnal heating — tropical convection is strongly timing-driven
  # shortwave_radiation gives actual insolation, not just time-of-day proxy
  - shortwave_radiation
  # 700 hPa — mid-level steering layer; slow vs fast-moving convective systems
  - windspeed_700hPa
  - winddirection_700hPa
  # 850 hPa — low-level jet, monsoon moisture transport, boundary-layer convergence
  - windspeed_850hPa
  - winddirection_850hPa
  - temperature_850hPa
  # 500 hPa — mid-troposphere blocking, trough/ridge position
  - geopotential_height_500hPa
  # 200 hPa — jet stream, upper divergence, storm outflow ventilation
  - windspeed_200hPa
  - winddirection_200hPa
  # Land surface — soil moisture feeds afternoon convection
  - soil_moisture_0_to_7cm

nwp_model: gfs_seamless
# historical-forecast-api.open-meteo.com only goes back to 2016-01-01
nwp_min_start: "2016-01-01"

precipitation_label_source: era5  # ERA5 precipitation field; no NASA account required
precipitation_label_threshold_mm: 1.0  # rain event if ERA5 precip >= 1mm in window
# Training: 2016-2024 (aligns with NWP availability; includes era5_recent.parquet for 2023-2024)
# Validation: 2025 — held-out year for model selection
# Testing: 2026 — final evaluation on current-year data
training_start: "2016-01-01"
training_end: "2024-12-31"
validation_start: "2025-01-01"
validation_end: "2025-12-31"
test_start: "2026-01-01"
test_end: "2026-06-30"
washoff_threshold_mm: 5.0
forecast_horizons: [12, 24, 36, 48]
