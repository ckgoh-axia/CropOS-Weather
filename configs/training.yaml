batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-5
epochs: 200
early_stopping_patience: 20
gradient_clip: 1.0
loss:
  brier_weight: 0.7
  csi_weight: 0.3
  # pos_weight: controls miss vs false-alarm tradeoff.
  # 1.0  → model predicts near base-rate everywhere, BSS ≈ 0, POD ≈ 13%
  # 16.5 → extreme upweighting, probabilities inflated, BSS strongly negative
  # 2.5  → moderate push toward detecting rain, targets POD > 30% without
  #         catastrophic calibration loss.  Tune via sweep if needed.
  pos_weight: 2.5
  reg_weight: 0.2    # only active when dual_head: true
