batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-5
epochs: 100
early_stopping_patience: 10
gradient_clip: 1.0
loss:
  brier_weight: 0.7
  csi_weight: 0.3
  pos_weight: 3.0    # lowered from 16.5 — full ratio distorts Brier calibration (BSS -4)
  reg_weight: 0.2    # only active when dual_head: true
